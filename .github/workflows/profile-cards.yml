name: Refresh profile cards

on:
  schedule:
    - cron: '17 2 * * *'   # daily, 10:17 WITA
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'assets/fonts/**', '.github/workflows/profile-cards.yml']

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build SVG cards from the GitHub API
        run: python scripts/build_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit when the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || { git commit -m "chore: refresh profile cards"; git push; }
